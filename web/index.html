<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="寺院で使われる外字・古字を撮影して登録するオフライン外字アルバム">
  <meta name="theme-color" content="#1E2A47">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="古字アルバム">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>古字アルバム</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1E2A47;
      overflow: hidden;
      /* iPhone: スクロールやバウンスでタップ座標がずれるのを防ぐ */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /*
      iPhone で「タップ位置と描画位置が全部ずれる」原因は3つあります。
        1) 入力欄の文字が 16px 未満だと iOS が勝手に拡大する（→ 以後ずれ続ける）
        2) キーボード表示時に iOS がページを押し上げ、visualViewport.offsetTop が
           0 に戻らず残留する
        3) ピンチ操作で拡大したまま戻らない（iOS は user-scalable=no を無視する）
      ここでは 2) と 3) をレイアウト固定＋JS で打ち消します。1) は Dart 側で
      入力欄の文字サイズを 16px 以上にして対処しています。
    */
    html {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      /* 長押しでテキスト選択されると座標がずれることがあるため抑止 */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 入力欄だけは選択・編集を許可する */
    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Flutter のホスト要素がはみ出さないように固定する */
    flutter-view,
    flt-glass-pane,
    flt-scene-host {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
    }

    /* Flutter が描画を始めるまでのスプラッシュ */
    #gaiji-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: radial-gradient(circle at 50% 38%, #2C3C61 0%, #1E2A47 45%, #131B2E 100%);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      color: #F6F3EA;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #gaiji-splash-mark {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(199, 162, 76, 0.55);
      border-radius: 18px;
      background: rgba(199, 162, 76, 0.08);
      box-shadow: 0 0 0 8px rgba(199, 162, 76, 0.05);
    }

    #gaiji-splash-mark span {
      font-size: 52px;
      line-height: 1;
      color: #E3CE96;
      font-weight: 500;
    }

    #gaiji-splash-title {
      font-size: 21px;
      letter-spacing: 0.32em;
      margin: 0;
      padding-left: 0.32em;
      color: #F6F3EA;
      font-weight: 400;
    }

    #gaiji-splash-sub {
      font-size: 12px;
      letter-spacing: 0.18em;
      margin: -14px 0 0 0;
      color: rgba(246, 243, 234, 0.55);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    }

    #gaiji-splash-spinner {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(199, 162, 76, 0.22);
      border-top-color: #C7A24C;
      border-radius: 50%;
      animation: gaiji-spin 0.9s linear infinite;
      margin-top: 6px;
    }

    #gaiji-splash-message {
      font-size: 13px;
      letter-spacing: 0.05em;
      color: rgba(246, 243, 234, 0.7);
      margin: 0;
      padding: 0 32px;
      text-align: center;
      line-height: 1.7;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      max-width: 340px;
    }

    @keyframes gaiji-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="gaiji-splash">
    <div id="gaiji-splash-mark"><span>字</span></div>
    <h1 id="gaiji-splash-title">古字アルバム</h1>
    <p id="gaiji-splash-sub">KOJI ALBUM</p>
    <div id="gaiji-splash-spinner"></div>
    <p id="gaiji-splash-message">読み込み中です</p>
  </div>

  <script>
    (function () {
      // ---------------------------------------------------------------
      // iPhone のタップ座標ズレ対策
      // ---------------------------------------------------------------
      // キーボードを閉じたあと、iOS は visualViewport.offsetTop が 0 に戻らず
      // ページが数十px押し上げられたまま残ります。その状態では描画位置と
      // タップ判定位置が食い違い、「全部のタップがずれる」症状になります。
      // 入力欄からフォーカスが外れたタイミングで強制的に位置を戻します。

      function resetViewport() {
        var vv = window.visualViewport;
        if (!vv) return;
        // 押し上げが残っている／拡大が残っている場合は元に戻す
        var drifted = Math.abs(vv.offsetTop) > 1 ||
                      Math.abs(vv.pageLeft || 0) > 1 ||
                      vv.scale > 1.01;
        if (!drifted) return;
        window.scrollTo(0, 0);
        if (document.scrollingElement) {
          document.scrollingElement.scrollTop = 0;
          document.scrollingElement.scrollLeft = 0;
        }
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
      }

      window.addEventListener('focusout', function () {
        // フォーカスが外れてからレイアウトが落ち着くまで待つ
        setTimeout(resetViewport, 60);
        setTimeout(resetViewport, 260);
      });

      window.addEventListener('orientationchange', function () {
        setTimeout(resetViewport, 320);
      });

      // ピンチ拡大を禁止する（iOS は user-scalable=no を無視するため）
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });

      // ダブルタップ拡大を抑止
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 320) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      // ---------------------------------------------------------------
      // スプラッシュ画面の制御
      // ---------------------------------------------------------------
      // Flutter が最初のフレームを描画すると flutter-first-frame が発火します
      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('gaiji-splash');
        if (!el) return;
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        window.setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 450);
      });

      // 25秒たっても起動しない場合は案内を出す（初回はエンジン取得に時間がかかります）
      window.setTimeout(function () {
        var el = document.getElementById('gaiji-splash');
        if (!el) return;
        var msg = document.getElementById('gaiji-splash-message');
        if (msg) {
          msg.textContent =
            '読み込みに時間がかかっています。通信環境をご確認のうえ、再読み込みしてください。';
        }
      }, 25000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
