<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    viewport-fit=cover は「内容をノッチ／ステータスバーの下まで広げる」指定です。
    これを付けると iOS は内容を画面端まで描く代わりに、ステータスバーの高さ分だけ
    表示を押し上げることがあり、その分だけタップ位置がずれます。
    座標の正確さを最優先して cover は使いません（背景色はアプリと同じ藍色）。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="寺院で使われる外字・古字を撮影して登録するオフライン外字アルバム">
  <meta name="theme-color" content="#1E2A47">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    black-translucent だと内容がステータスバーの下に潜り、iOS がレイアウトを
    押し上げる＝タップ座標がずれる原因になります。default で切り分けます。
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="古字アルバム">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>古字アルバム</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1E2A47;
      overflow: hidden;
      /* iPhone: スクロールやバウンスでタップ座標がずれるのを防ぐ */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /*
      【2026-11 修正】iPhone で「タップ位置が少し上にずれる」件の本命の対処。

      iOS を「ホーム画面に追加」して起動した PWA では、iOS がページ全体を
      数十px 押し下げ／押し上げしたまま固定してしまうことがあります
      （Flutter 公式の不具合報告 #115829 / #111896 と同根）。
      その状態では「描画されている位置」と「タップが当たる位置」の原点が
      食い違い、ボタンの少し上を押すと反応する、という症状になります。

      対策は「ページを1pxもスクロールさせないこと」。
      html と body を画面に固定し、スクロールの余地を完全に消します。
      併せて JS 側でもスクロール位置を常に 0 に戻しています（下の script）。
    */
    html {
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /*
      body は通常「画面に固定」(body.locked) してスクロールの余地を消します。
      ただし入力中だけは固定を外します。固定したままだと iOS が
      キーボードに隠れた入力欄を画面内へ送れなくなるためです。
      （切り替えは下の script が行います）
    */
    body {
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      /* 長押しでテキスト選択されると座標がずれることがあるため抑止 */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body.locked {
      position: fixed;
      inset: 0;
    }

    /* 入力欄だけは選択・編集を許可する */
    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /*
      touch-action: manipulation は「ダブルタップ拡大をしない」指定ですが、
      このプロパティは継承されません。Flutter が内部で作る要素にも個別に
      効かせる必要があるため、全要素に一括で適用します。
      （レイアウトには一切影響しないので、安全に使えます）
    */
    * {
      touch-action: manipulation;
    }

    /*
      Flutter のホスト要素（flutter-view / flt-glass-pane）には手を加えない。
      ここに position:fixed や width/height を !important で上書きすると、
      レンダリング位置とタップ判定位置がずれ、全てのタップが別の場所に
      当たるようになる（実測で約120px のズレが出た）。
      Flutter エンジン自身が正しいサイズを設定するので、触らないのが正解。
    */

    /* Flutter が描画を始めるまでのスプラッシュ */
    #gaiji-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: radial-gradient(circle at 50% 38%, #2C3C61 0%, #1E2A47 45%, #131B2E 100%);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      color: #F6F3EA;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #gaiji-splash-mark {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(199, 162, 76, 0.55);
      border-radius: 18px;
      background: rgba(199, 162, 76, 0.08);
      box-shadow: 0 0 0 8px rgba(199, 162, 76, 0.05);
    }

    #gaiji-splash-mark span {
      font-size: 52px;
      line-height: 1;
      color: #E3CE96;
      font-weight: 500;
    }

    #gaiji-splash-title {
      font-size: 21px;
      letter-spacing: 0.32em;
      margin: 0;
      padding-left: 0.32em;
      color: #F6F3EA;
      font-weight: 400;
    }

    #gaiji-splash-sub {
      font-size: 12px;
      letter-spacing: 0.18em;
      margin: -14px 0 0 0;
      color: rgba(246, 243, 234, 0.55);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    }

    #gaiji-splash-spinner {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(199, 162, 76, 0.22);
      border-top-color: #C7A24C;
      border-radius: 50%;
      animation: gaiji-spin 0.9s linear infinite;
      margin-top: 6px;
    }

    #gaiji-splash-message {
      font-size: 13px;
      letter-spacing: 0.05em;
      color: rgba(246, 243, 234, 0.7);
      margin: 0;
      padding: 0 32px;
      text-align: center;
      line-height: 1.7;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      max-width: 340px;
    }

    @keyframes gaiji-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="gaiji-splash">
    <div id="gaiji-splash-mark"><span>字</span></div>
    <h1 id="gaiji-splash-title">古字アルバム</h1>
    <p id="gaiji-splash-sub">KOJI ALBUM</p>
    <div id="gaiji-splash-spinner"></div>
    <p id="gaiji-splash-message">読み込み中です</p>
  </div>

  <script>
    (function () {
      // ---------------------------------------------------------------
      // iPhone のタップ座標ズレ対策（本命）
      // ---------------------------------------------------------------
      // 症状：ボタンを押すと、その「少し上」が反応する。
      //
      // これはページが数px〜数十px スクロールしている時に起こります。
      // iOS（とくにホーム画面に追加した PWA）は、キーボードの表示／非表示や
      // ステータスバーの伸縮のあと、ページを押し上げたまま固定してしまう
      // ことがあります（Flutter 公式 #115829 / #111896 と同根）。
      // スクロール量を S とすると、画面の Y を押したのに文書の Y+S が
      // 反応するため、「少し上を押すと反応する」ように見えます。
      //
      // 対策：スクロール位置を常に 0 に固定する。
      // CSS 側（html/body を position:fixed）と二重で止めています。

      function lockScroll() {
        if (window.scrollX !== 0 || window.scrollY !== 0) {
          window.scrollTo(0, 0);
        }
        var el = document.scrollingElement || document.documentElement;
        if (el) {
          if (el.scrollTop !== 0) el.scrollTop = 0;
          if (el.scrollLeft !== 0) el.scrollLeft = 0;
        }
      }

      // 入力中だけは body の固定を外す（キーボードで隠れた欄へ送れるように）
      function isTyping() {
        var a = document.activeElement;
        if (!a) return false;
        var t = (a.tagName || '').toLowerCase();
        return t === 'input' || t === 'textarea' || a.isContentEditable === true;
      }

      function syncBodyLock() {
        var b = document.body;
        if (!b) return;
        if (isTyping()) {
          b.classList.remove('locked');
        } else {
          b.classList.add('locked');
          lockScroll();
        }
      }

      document.addEventListener('focusin', syncBodyLock, true);
      document.addEventListener('focusout', function () {
        setTimeout(syncBodyLock, 0);
      }, true);
      if (document.body) {
        document.body.classList.add('locked');
      } else {
        document.addEventListener('DOMContentLoaded', syncBodyLock);
      }

      window.addEventListener('scroll', lockScroll, { passive: true });
      document.addEventListener('scroll', lockScroll, {
        passive: true,
        capture: true,
      });
      window.addEventListener('touchstart', lockScroll, { passive: true });
      window.addEventListener('touchend', lockScroll, { passive: true });

      // 押した瞬間にも位置をそろえる（ズレたまま反応するのを防ぐ最終防波堤）
      window.addEventListener('pointerdown', lockScroll, {
        passive: true,
        capture: true,
      });

      // 画面回転・リサイズでも位置が戻るようにする
      window.addEventListener('resize', lockScroll);
      window.addEventListener('pageshow', lockScroll);

      // キーボードを閉じたあと、visualViewport が押し上げられたまま残る件
      function resetViewport() {
        lockScroll();
        var vv = window.visualViewport;
        if (!vv) return;
        var drifted = Math.abs(vv.offsetTop) > 1 ||
                      Math.abs(vv.pageLeft || 0) > 1 ||
                      vv.scale > 1.01;
        if (!drifted) return;
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
        lockScroll();
      }

      window.addEventListener('focusout', function () {
        // フォーカスが外れてからレイアウトが落ち着くまで待つ
        setTimeout(resetViewport, 60);
        setTimeout(resetViewport, 260);
      });

      // iOS がキーボード表示で押し上げたまま残す「残留」を直接監視する。
      // visualViewport の変化はこの症状の発生源そのものなので、
      // 変化したら即座に位置を戻します。
      if (window.visualViewport) {
        window.visualViewport.addEventListener('scroll', resetViewport, {
          passive: true,
        });
        window.visualViewport.addEventListener('resize', function () {
          // キーボードが閉じきってから戻す
          setTimeout(resetViewport, 120);
          setTimeout(resetViewport, 400);
        }, { passive: true });
      }

      window.addEventListener('orientationchange', function () {
        setTimeout(resetViewport, 320);
      });

      // ピンチ拡大を禁止する（iOS は user-scalable=no を無視するため）
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });

      // 2本指以上の操作（ピンチ）だけを止める。
      // 1本指の操作は Flutter の一覧スクロールに必要なので妨げない。
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      // ダブルタップ拡大を抑止
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 320) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      // 起動直後は、iOS がレイアウトを落ち着かせるまで数回そろえる
      [50, 150, 350, 700, 1200, 2000].forEach(function (t) {
        setTimeout(lockScroll, t);
      });
      lockScroll();

      // ---------------------------------------------------------------
      // スプラッシュ画面の制御
      // ---------------------------------------------------------------
      // Flutter が最初のフレームを描画すると flutter-first-frame が発火します
      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('gaiji-splash');
        if (!el) return;
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        window.setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 450);
      });

      // 25秒たっても起動しない場合は案内を出す（初回はエンジン取得に時間がかかります）
      window.setTimeout(function () {
        var el = document.getElementById('gaiji-splash');
        if (!el) return;
        var msg = document.getElementById('gaiji-splash-message');
        if (msg) {
          msg.textContent =
            '読み込みに時間がかかっています。通信環境をご確認のうえ、再読み込みしてください。';
        }
      }, 25000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
